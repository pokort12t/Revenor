<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ravenor</title><style>*{box-sizing:border-box}body{margin:0;background:#172a1b;color:#fff;font:16px Arial}button{border:2px solid #8d642f;background:#382619;color:#ffe4ad;border-radius:9px;padding:10px;font-weight:700}.top{height:58px;display:flex;background:#302117;gap:5px;padding:5px}.top button{flex:1}.map{height:calc(100vh - 128px);position:relative;overflow:hidden;background:linear-gradient(135deg,#467c42,#86aa5b,#3d7044)}.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px}.reg{height:72px;font-size:11px;background:#4e7b47}.me{outline:3px solid #ffd451}.side{position:absolute;right:5px;top:5px;width:92px;display:flex;flex-direction:column;gap:5px}.side button{height:68px;font-size:12px}.side b{font-size:20px;display:block}.bottom{height:70px;display:flex;gap:8px;padding:7px;background:#2b2018}.bottom button{flex:1;font-size:18px}.panel{position:absolute;z-index:4;left:8px;right:104px;top:8px;bottom:8px;overflow:auto;background:#211913f2;border:2px solid #a87531;border-radius:12px;padding:12px}.row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #57412b}.server{padding:20px}.card{background:#241b15;border:2px solid #a87531;border-radius:12px;padding:15px;margin:10px 0}h1{text-align:center;color:#ffd889}
</style><body><div id="start"><h1>👑 RAVENOR</h1><div class="card"><h2>СЕРВЕР</h2><div>Ravenor I</div><div id="count">0/55</div><button onclick="join()">Приєднатися</button></div></div><div id="game" style="display:none"><div class="top"><button onclick="panel('settlements')">🏘️ Поселення</button><button onclick="panel('mines')">⛏️ Шахти</button><button onclick="panel('gold')">🪙 Золото</button></div><div class="map"><div class="regions" id="regions"></div><div class="side"><button onclick="panel('power')"><b>👑</b>Влада</button><button onclick="panel('people')"><b>👥</b>Люди</button><button onclick="panel('army')"><b>⚔️</b>Армія</button></div><div id="modal"></div></div><div class="bottom"><button onclick="draw()">🗺️ Карта</button><button onclick="panel('region')">📜 Регіон</button></div></div><script>
let me;const A=(u,o)=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(x=>x.json());async function join(){let d=await A('/api/start',{method:'POST',body:JSON.stringify({telegram_id:'dev-'+Date.now(),name:'Гравець'})});if(!d.ok)return alert(d.error);me=d.player;openGame()}async function openGame(){document.getElementById('start').style.display='none';document.getElementById('game').style.display='block';draw()}async function draw(){let s=await A('/api/server');me=(await A('/api/me')).player;document.getElementById('count').textContent=s.players+'/55';document.getElementById('regions').innerHTML=s.regions.map(r=>`<button class="reg ${r.id==me.region?'me':''}" onclick="region(${r.id})">${r.id}. ${r.name}<br>${r.lord?'👑 зайнятий':'⚪ вільний'}</button>`).join('')}async function region(i){let d=await A('/api/region/'+i);let r=d.region;document.getElementById('modal').innerHTML=`<div class=panel><h2>🏰 ${r.name}</h2><div class=row>Лорд <b>${r.lord||'Немає'}</b></div><div class=row>Ферми <b>${r.farms}</b></div><div class=row>Шахти <b>${r.mines}</b></div><h3>Поселення</h3>${d.settlements.map(s=>`<div class=row>${s.kind==='city'?'🏙️':'🏘️'} ${s.name}<span>👥${s.people} 🐄${s.livestock}</span></div>`).join('')}<button onclick="closeP()">Закрити</button></div>`}function closeP(){document.getElementById('modal').innerHTML=''}async function panel(t){me=(await A('/api/me')).player;let h='';if(t==='gold')h=`<h2>🪙 Золото</h2><div class=row>Золото <b>${me.gold}</b></div><p>Ліміт сервера: 2 000 000.</p>`;if(t==='people')h='<h2>👥 Люди</h2><p>Тут будуть скарги та звернення підданих.</p>';if(t==='army'){let a=await A('/api/army');h='<h2>⚔️ Армія</h2>'+[['Солдат',a.soldiers],['Лицар',a.knights],['Кіннота',a.cavalry],['Лучник',a.archers]].map(x=>`<div class=row>${x[0]} × ${x[1][0]} <span>🛡️${x[1][1]} ⚔️${x[1][2]}</span></div>`).join('')+'<p>Облога: '+a.siege.join(' • ')+'</p>'}if(t==='settlements'){let d=await A('/api/region/'+me.region);h='<h2>🏘️ Поселення</h2>'+d.settlements.map(s=>`<div class=row>${s.name}<span>👥${s.people}</span></div>`).join('')}if(t==='mines'){let d=await A('/api/region/'+me.region);h=`<h2>⛏️ Шахти</h2><div class=row>Кількість <b>${d.region.mines}</b></div>`}if(t==='power')h=`<h2>👑 Влада</h2><div class=row>Статус <b>${me.status}</b></div><button onclick="act('/api/develop')">🌾 Розвинути</button> <button onclick="act('/api/capital')">🏰 Столиця</button><button onclick="act('/api/rebel')">🗡️ Повстання</button><p>Лорд може оголосити війну іншому лорду без згоди короля.</p>`;if(t==='region')h=`<h2>📜 Регіон</h2><p>Твій регіон №${me.region}.</p>`;document.getElementById('modal').innerHTML=`<div class=panel>${h}<br><button onclick="closeP()">Закрити</button></div>`}async function act(u){let d=await A(u,{method:'POST'});alert(d.message||d.error||'Готово');closeP();draw()}
</script></body></html>
