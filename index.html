<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бункер — онлайн</title>
<style>
:root{color-scheme:dark;--bg:#101611;--panel:#1c261e;--line:#3e5542;--accent:#b6d18a;--text:#f0f4e9;--muted:#a8b5a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#293b2b,#101611 60%);font-family:system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh}header{text-align:center;padding:25px 14px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:38px;letter-spacing:3px}header p{color:var(--muted);margin:7px}main{max-width:760px;margin:auto;padding:16px 13px 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px}h2{margin:0 0 13px;color:var(--accent);font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #506651;background:#111a13;color:var(--text);font:inherit;min-height:45px}textarea{min-height:72px}.full{grid-column:1/-1}.btn{background:var(--accent);color:#172016;font-weight:800;border:0;border-radius:11px;padding:13px;width:100%;font-size:16px;margin-top:10px}.btn.secondary{background:#2a3b2d;color:var(--text);border:1px solid #506651}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.code{font-size:30px;letter-spacing:5px;font-weight:900;text-align:center;color:var(--accent)}.player{padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.player small{color:var(--muted)}.result{white-space:pre-wrap;line-height:1.55;background:#111a13;padding:14px;border-radius:10px}.pill{display:inline-block;background:#314631;border-radius:30px;padding:5px 9px;font-size:12px;margin:3px}button:disabled{opacity:.4}@media(max-width:480px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><h1>☢ БУНКЕР</h1><p>Онлайн-гра на виживання • створи кімнату або приєднайся за кодом</p></header><main>
<section id="home">
<div class="card"><h2>👑 Створити кімнату</h2><label>Твоє ім’я</label><input id="hostName" maxlength="20" placeholder="Наприклад, Рома"><label style="margin-top:10px">Кількість гравців (тестовий режим: можна 1)</label><input id="maxPlayers" type="number" min="1" max="20" value="1"><label style="margin-top:10px">Скільки місць у бункері</label><input id="capacity" type="number" min="1" max="19" value="1"><button class="btn" id="createBtn">Створити кімнату</button></div>
<div class="card"><h2>🔑 Приєднатися</h2><label>Твоє ім’я</label><input id="joinName" maxlength="20" placeholder="Введи ім’я"><label style="margin-top:10px">Код кімнати</label><input id="roomCode" maxlength="6" placeholder="6-значний код" inputmode="numeric"><button class="btn secondary" id="joinBtn">Увійти за кодом</button></div>
<p class="muted">Потрібне інтернет-з’єднання. Усі гравці мають відкрити гру та підключитися до однієї кімнати.</p></section>
<section id="lobby" class="hidden">
<div class="card"><h2>🏚️ Кімната очікування</h2><div id="codeView" class="code"></div><p class="muted" style="text-align:center">Надішли цей код друзям. Чекаємо на гравців…</p><div id="players"></div><div id="waitingPlayers" class="result" style="margin-top:12px">Очікуємо на гравців…</div><p id="lobbyStatus" class="muted"></p><button id="startBtn" class="btn">▶ Почати гру</button><button id="leaveBtn" class="btn secondary">Вийти з кімнати</button></div>
</section></main><script src="https://bunker-revenor.onrender.com/socket.io/socket.io.js"></script><script>
const socket=io("https://bunker-revenor.onrender.com",{transports:["websocket","polling"]});
let state=null;
const $=id=>document.getElementById(id);
function showLobby(){ $("home").classList.add("hidden");$("lobby").classList.remove("hidden"); }
function showHome(){ $("home").classList.remove("hidden");$("lobby").classList.add("hidden");state=null; }
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function emitError(msg){alert(msg||"Сталася помилка.");}
function handleResponse(r){
  if(!r||!r.ok){emitError(r?.error||"Сервер не відповів. Спробуй ще раз.");return;}
  if(r.state){state=r.state;showLobby();render();}
}
$("createBtn").addEventListener("click",()=>{
  const name=$("hostName").value.trim();
  const maxPlayers=Number($("maxPlayers").value);
  const capacity=Number($("capacity").value);
  if(!name){emitError("Введи своє ім’я.");return;}
  if(!Number.isInteger(maxPlayers)||maxPlayers<1||maxPlayers>20){emitError("Кількість гравців має бути від 1 до 20.");return;}
  if(!Number.isInteger(capacity)||capacity<1||capacity>maxPlayers){emitError("Кількість місць у бункері має бути від 1 до кількості гравців.");return;}
  if(!socket.connected){emitError("Немає з’єднання із сервером. Зачекай кілька секунд і спробуй ще раз.");return;}
  $("createBtn").disabled=true;
  socket.timeout(10000).emit("createRoom",{name,maxPlayers,capacity},(err,r)=>{
    $("createBtn").disabled=false;
    if(err){emitError("Сервер не відповів. Онови сторінку та спробуй ще раз.");return;}
    handleResponse(r);
  });
});
$("joinBtn").addEventListener("click",()=>{
  const name=$("joinName").value.trim(),code=$("roomCode").value.trim();
  if(!name||!code){emitError("Введи ім’я та код кімнати.");return;}
  if(!socket.connected){emitError("Немає з’єднання із сервером. Спробуй ще раз.");return;}
  $("joinBtn").disabled=true;
  socket.timeout(10000).emit("joinRoom",{name,code},(err,r)=>{
    $("joinBtn").disabled=false;
    if(err){emitError("Сервер не відповів. Спробуй ще раз.");return;}
    handleResponse(r);
  });
});
function render(){
  if(!state)return;
  $("codeView").textContent=state.code;\n  const startBtn=$("startBtn");\n  startBtn.classList.toggle("hidden",!state.isHost||state.phase!=="lobby");\n  startBtn.disabled=state.players.length!==state.maxPlayers;\n  startBtn.textContent=state.players.length===state.maxPlayers?"▶ Почати гру":"Очікуємо всіх гравців";\n  $("lobbyStatus").textContent=state.phase!=="lobby"?(state.status||"Гру розпочато."):(state.isHost?"Ти ведучий. Коли всі приєднаються, натисни «Почати гру».":"Очікуємо, поки ведучий почне гру.");
  $("waitingPlayers").innerHTML="<strong>👥 Учасники кімнати ("+state.players.length+"/"+state.maxPlayers+")</strong><br>"+
    state.players.map((p,i)=>'<div style="padding:8px 0;border-bottom:1px solid #3e5542">'+(i+1)+". "+esc(p.name)+(p.id===state.hostId?' 👑 <span class="muted">Ведучий</span>':"")+(p.eliminated?" — виключений":' <span class="muted">• у кімнаті</span>')+"</div>").join("")+
    (state.players.length<state.maxPlayers?'<p class="muted">Ще очікуємо '+(state.maxPlayers-state.players.length)+" гравців.</p>":"<p>✅ Усі гравці приєдналися!</p>");
  $("players").innerHTML=state.players.map(p=>'<div class="player"><span>'+esc(p.name)+(p.id===state.hostId?" 👑":"")+(p.eliminated?" <small>— виключений</small>":"")+"</span>"+(state.isHost&&p.id!==state.meId&&!p.eliminated?'<button class="btn secondary kick" data-id="'+esc(p.id)+'" style="width:auto;margin:0;padding:7px 10px">Вигнати</button>':"")+"</div>").join("");
  document.querySelectorAll(".kick").forEach(b=>b.onclick=()=>{
    if(confirm("Вигнати гравця з кімнати?"))socket.emit("kick",{targetId:b.dataset.id},r=>{if(!r?.ok)emitError(r?.error);});
  });
}
$("startBtn").addEventListener("click",()=>{
  if(!state||!state.isHost)return;
  if(state.players.length!==state.maxPlayers){emitError("Дочекайся всіх гравців.");return;}
  $("startBtn").disabled=true;
  socket.timeout(10000).emit("startGame",{},(err,r)=>{
    if(err){$("startBtn").disabled=false;emitError("Сервер не відповів. Спробуй ще раз.");return;}
    if(!r?.ok){$("startBtn").disabled=false;emitError(r?.error||"Не вдалося почати гру.");}
  });
});
$("leaveBtn").addEventListener("click",()=>{
  if(!confirm("Точно хочеш вийти з кімнати?"+(state?.isHost?"\nЯкщо ти ведучий, кімната закриється для всіх гравців.":"")))return;
  socket.emit("leaveRoom");
  showHome();
});
socket.on("roomClosed",()=>{alert("Ведучий вийшов. Кімнату закрито для всіх.");showHome();});
socket.on("state",s=>{state=s;showLobby();render();});
socket.on("kicked",()=>{alert("Тебе вигнали з кімнати.");showHome();});
socket.on("connect",()=>{const el=$("lobbyStatus");if(el)el.textContent="З’єднання із сервером встановлено.";});
socket.on("connect_error",()=>{const el=$("lobbyStatus");if(el)el.textContent="Не вдалося підключитися до сервера. Перевір інтернет і спробуй оновити сторінку.";});
</script></body></html>
